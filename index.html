<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather_Web</title>
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <section class="main_header">
            <section class="logo">
                <a href="#"><img src="img/logo.png" alt="logo"></a>
            </section>
            <div class="navbox">
                <section class="nav">
                    <ul>
                        <li><a href="#">지역</a></li>
                        <li><a href="#">미세먼지</a></li>
                        <li><a href="#">메뉴3</a></li>
                        <li><a href="#">메뉴4</a></li>
                    </ul>
                </section>
            </div>
        </section>
    </header>
    <div class="main_degree">
        <section class="degree">
            <input class="w_input" type="text" value="">
            <input class="t_input" type="text" value="">
            <section class="img">
                <img class="cloudy" src="img/cloudy.png" alt="흐림">
                <img class="sunny" src="img/suuny.png" alt="맑음">
                <img class="rainy" src="img/rainy.png" alt="강우">
                <img class="thunder" src="img/thunder.png" alt="뇌우">
                <img class="snowy" src="img/snowy.png" alt="눈">
                <img class="hamburger" src="img/bigmac.png" alt="햄버거">
                <img class="middlefinger" src="img/middlefinger.png" alt="중지">
                <img class="hhj" src="img/hhj.JPG" alt="한형준">
            </section>
            <section class="temperature">
                <p>현재 온도</p>
                <div class="wrap_t">
                    <p class="temperature_s"></p>
                    <p>℃</p>
                </div>
            </section>
        </section>
    </div>
    <section class="lifetip"></section>
    <footer></footer>
    <script src="script.js"></script>
</body>

</html>
